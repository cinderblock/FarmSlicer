<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FarmSlicer</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#131823" />
    <!-- The theme someone picked (web/src/theme.ts), before the first paint. -->
    <script>
      try {
        var t = localStorage.getItem("farmslicer.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        if ((t || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")) === "light")
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#ffffff");
      } catch (e) {}
    </script>
    <!-- Installed on a phone's home screen (iOS reads these, not the manifest's icons). -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FarmSlicer" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
