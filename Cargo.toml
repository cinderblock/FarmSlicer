[package]
name = "farmslicer"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
cxx = "1"
# Accounts: passkeys (WebAuthn), SHA-256 digests for session/API-key/invite
# tokens, random tokens.
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }
# webauthn-rs uses OpenSSL; build it in so neither the Docker image nor a dev
# machine needs a system OpenSSL. The binary's only OpenSSL: the C++ side has
# none (libslic3r's MD5 is cxx/shims/openssl/md5.h).
openssl = { version = "0.10", features = ["vendored"] }
url = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
# Groups and quotas: UTC period boundaries, self-service identifier patterns.
chrono = { version = "0.4", default-features = false, features = ["now", "std"] }
regex = "1"
# Discovery: share the SSDP port with other listeners (SO_REUSEADDR/PORT).
socket2 = { version = "0.6", features = ["all"] }
# Bambu printers: MQTT over TLS (status, commands) and FTPS (uploads). rustls
# on the ring provider: no C toolchain beyond what ring needs.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
futures-util = "0.3"
# Sliced Bambu projects (.gcode.3mf): zip, slice_info.config XML, G-code MD5.
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
# G-code previews: plain G-code gzipped on the way out (src/preview_api.rs).
flate2 = "1"
md-5 = "0.11"
# Group logos for thumbnails: decode PNG/JPEG, shrink, store as PNG.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Cameras: RTSP (H.264 for X1/H2-class printers), frames to browsers as bytes.
retina = { version = "0.4", default-features = false }
bytes = "1"
base64 = "0.22"
# Klipper (Moonraker), OctoPrint, PrusaLink, Elegoo: HTTP (uploads, REST) on
# the ring-based rustls above, and WebSocket JSON (Moonraker, Elegoo SDCP).
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls-manual-roots-no-provider"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
# Discovery of Klipper, OctoPrint and PrusaLink printers (mDNS / DNS-SD).
mdns-sd = "0.13"
# Webhooks: HTTPS to the internet, certificates checked against Mozilla's
# root store (the printers' client above accepts anything).
webpki-roots = "1"

[dev-dependencies]
# Self-signed certificates for the in-process FTPS test server.
rcgen = "0.14"

[build-dependencies]
cxx-build = "1"
