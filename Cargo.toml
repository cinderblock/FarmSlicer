[package]
name = "farmslicer"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "set-header"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
cxx = "1"
# Accounts: passkeys (WebAuthn), SHA-256 digests for session/API-key/invite
# tokens, random tokens.
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }
# webauthn-rs uses OpenSSL; build it in so neither the Docker image nor a dev
# machine needs a system OpenSSL.
openssl = { version = "0.10", features = ["vendored"] }
url = "2"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

[build-dependencies]
cxx-build = "1"
