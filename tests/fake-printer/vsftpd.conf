listen=YES
listen_port=990
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
ssl_enable=YES
implicit_ssl=YES
require_ssl_reuse=YES
force_local_logins_ssl=YES
force_local_data_ssl=YES
rsa_cert_file=/etc/fake/server.crt
rsa_private_key_file=/etc/fake/server.key
pasv_enable=YES
pasv_min_port=50000
pasv_max_port=50010
seccomp_sandbox=NO
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
xferlog_enable=YES
vsftpd_log_file=/var/log/vsftpd.log
chroot_local_user=YES
allow_writeable_chroot=YES
